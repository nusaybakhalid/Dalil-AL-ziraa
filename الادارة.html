<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المحاصيل الذكي</title>
    <style>
        :root { --primary-green: #2e7d32; --accent-green: #4caf50; --danger-red: #e53935; --bg-color: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); margin: 0; padding: 20px; }
  .container { max-width: 1000px; margin: auto; }
        header { text-align: center; color: var(--primary-green); margin-bottom: 30px; }
  .top-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
  .btn-back { background: #fff; color: var(--primary-green); border: 1.5px solid var(--primary-green); padding: 8px 18px; border-radius: 20px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn-back:hover { background: var(--primary-green); color: #fff; }
  .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
  .form-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
  .form-control { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-top: 5px; }
        button { cursor: pointer; border: none; border-radius: 5px; transition: 0.3s; padding: 10px 20px; }
  .btn-add { background: var(--primary-green); color: white; height: 42px; }
  .btn-add:hover { background: var(--accent-green); }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: var(--primary-green); color: white; }
  .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
  .harvest-soon { background: #fff3e0; color: #ef6c00; }
  .growing { background: #e8f5e9; color: #2e7d32; }
  .btn-delete { background: var(--danger-red); color: white; padding: 5px 10px; }
  .calendar-link { text-align: center; margin-top: 20px; }
  .info-text { font-size: 0.9em; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">

    <div class="top-bar">
        <a href="index.html" class="btn-back">← رجوع</a>
    </div>

    <header>
        <h1>🌱 مدير المحاصيل والجدول الزمني</h1>
        <p>قم بإضافة محاصيلك لمتابعة وقت الحصاد بدقة</p>
    </header>

    <div class="card">
        <h3>➕ إضافة محصول جديد</h3>
        <div class="form-group">
            <div class="form-control"><label>اسم المحصول</label><input type="text" id="cropName" placeholder="مثلاً: طماطم، قمح..."></div>
            <div class="form-control"><label>تاريخ الزراعة</label><input type="date" id="plantDate"></div>
            <div class="form-control"><label>مدة النمو (بالأيام)</label><input type="number" id="growthDuration" placeholder="مثلاً: 90"></div>
            <button class="btn-add" onclick="addCrop()">إضافة للمخطط</button>
        </div>
        <p class="info-text">* سيقوم النظام تلقائياً بحساب تاريخ الحصاد ويرسله للتقويم.</p>
    </div>

    <div class="card">
        <h3>📋 قائمة المحاصيل القائمة</h3>
        <table>
            <thead><tr><th>المحصول</th><th>تاريخ الزراعة</th><th>تاريخ الحصاد المتوقع</th><th>الأيام المتبقية</th><th>الحالة</th><th>إجراءات</th></tr></thead>
            <tbody id="cropTableBody"></tbody>
        </table>
    </div>

    <div class="calendar-link">
        <a href="التقويم الزمني.html"><button class="btn-add">📅 فتح التقويم الزمني</button></a>
    </div>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('farm_currentUser'));
if(!currentUser){
    alert('يجب تسجيل الدخول أولاً');
    window.location.href = 'login.html';
}

let allCrops = JSON.parse(localStorage.getItem('farm_allCrops') || '[]');
let crops = allCrops.filter(c => c.userId === currentUser.id);

function addCrop() {
    const name = document.getElementById('cropName').value;
    const pDate = document.getElementById('plantDate').value;
    const duration = document.getElementById('growthDuration').value;
    if (!name ||!pDate ||!duration) { alert("يرجى ملء جميع الحقول!"); return; }
    const crop = { id: Date.now(), userId: currentUser.id, name: name, plantDate: pDate, duration: parseInt(duration) };
    allCrops.push(crop); crops.push(crop); saveAndRender();
    document.getElementById('cropName').value = ''; document.getElementById('growthDuration').value = '';
}
function deleteCrop(id) {
    allCrops = allCrops.filter(c => c.id!== id); crops = crops.filter(c => c.id!== id); saveAndRender();
}
function calculateHarvestDate(plantDate, duration) {
    let date = new Date(plantDate); date.setDate(date.getDate() + duration); return date;
}
function saveAndRender() {
    localStorage.setItem('farm_allCrops', JSON.stringify(allCrops));
    let calendarData = crops.map(c => {
        let hDate = calculateHarvestDate(c.plantDate, c.duration);
        return { id: c.id, userId: c.userId, name: c.name, start: c.plantDate, end: hDate.toISOString().split('T')[0], title: c.name, type: "محصول" };
    });
    localStorage.setItem('farmCrops_' + currentUser.id, JSON.stringify(calendarData));
    renderCrops();
}
function renderCrops() {
    const tbody = document.getElementById('cropTableBody'); tbody.innerHTML = '';
    if(crops.length === 0) { tbody.innerHTML = '<tr><td colspan="6">لا يوجد محاصيل بعد - اضف محصول جديد</td></tr>'; return; }
    crops.forEach(crop => {
        const hDate = calculateHarvestDate(crop.plantDate, crop.duration); const today = new Date();
        const daysLeft = Math.ceil((hDate - today) / (1000 * 60 * 60 * 24));
        let statusClass = daysLeft <= 7? 'harvest-soon' : 'growing';
        let statusText = daysLeft <= 0? 'جاهز للحصاد' : (daysLeft <= 7? 'اقترب الحصاد' : 'في مرحلة النمو');
        tbody.innerHTML += `<tr><td><strong>${crop.name}</strong></td><td>${crop.plantDate}</td><td>${hDate.toLocaleDateString('ar-EG')}</td><td>${daysLeft > 0? daysLeft + ' يوم' : 'حان الوقت'}</td><td><span class="status-badge ${statusClass}">${statusText}</span></td><td><button class="btn-delete" onclick="deleteCrop(${crop.id})">حذف</button></td></tr>`;
    });
}
window.onload = renderCrops;
</script>
</body>
</html>
