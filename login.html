<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل الزراعة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#2E7D32;--green-light:#3aa67d;--bg:#F8FFF8}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{
  min-height:100vh;
  background: var(--bg);
  display:flex;justify-content:center;align-items:center;
  padding:20px;
}
.box{
  background:#fff;
  width:100%;max-width:410px;
  border-radius:30px;
  padding:35px 30px 28px;
  box-shadow:0 15px 40px rgba(46,125,50,0.12);
  text-align:center;
  border:2px solid #E8F5E9;
}
.logo{font-size:26px;font-weight:800;color:#111;display:flex;justify-content:center;gap:6px;align-items:center}
.sub{color:#777;font-size:13px;margin:4px 0 22px}
.main-title{font-size:22px;font-weight:800;color:#111;margin-bottom:22px}

.field{text-align:right;margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:#333;margin-bottom:6px;padding-right:4px}
.field input{
  width:100%;padding:12px 16px;
  border:2px solid transparent;
  background:#E8F5E9;
  border-radius:12px;font-size:14px;
  outline:none;text-align:right;
  transition:0.3s;
}
.field input:focus{background:#fff;border-color:#4CAF50}
.field input.ltr{direction:ltr;text-align:left}

.error{color:#d32f2f;font-weight:600;display:none;background:#ffebee;padding:9px;border-radius:10px;font-size:13px;margin-bottom:12px}
.success{color:var(--green);font-weight:600;display:none;background:#E8F5E9;padding:9px;border-radius:10px;font-size:13px;margin-bottom:12px}

.btns{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.btn-main{
  width:100%;padding:13px;
  background:var(--green-light);color:#fff;
  border:none;border-radius:25px;
  font-weight:800;font-size:15px;
  cursor:pointer;transition:0.3s;
  box-shadow:0 4px 15px rgba(58,166,125,0.3);
}
.btn-main:hover{background:var(--green);transform:translateY(-1px)}
.btn-sec{
  width:100%;padding:12px;
  background:#fff;color:var(--green);
  border:1.5px solid #4CAF50;
  border-radius:25px;font-weight:700;font-size:14px;
  cursor:pointer;transition:0.3s;
}
.btn-sec:hover{background:#E8F5E9}
.link-text{font-size:13px;color:#666;margin-top:5px}
</style>
</head>
<body>
<div class="box">
<div class="logo">🌱 دليل الزراعة</div>
<div class="sub">الإدارة الذكية للزراعة</div>
<div class="main-title" id="mainTitle">تسجيل الدخول</div>

<div id="msgError" class="error"></div>
<div id="msgSuccess" class="success"></div>

<div id="loginFields">
  <div class="field">
    <label>البريد الالكتروني</label>
    <input type="text" id="loginEmail" class="ltr" placeholder="example@email.com">
  </div>
  <div class="field">
    <label>كلمة السر</label>
    <input type="password" id="loginPass" placeholder="ادخل كلمة السر هنا">
  </div>
</div>

<div id="regFields" style="display:none">
  <div class="field">
    <label>الاسم الكامل</label>
    <input type="text" id="regName" placeholder="اسمك الكامل">
  </div>
  <div class="field">
    <label>البريد الالكتروني</label>
    <input type="text" id="regEmail" class="ltr" placeholder="example@email.com">
  </div>
  <div class="field">
    <label>كلمة السر</label>
    <input type="password" id="regPass" placeholder="انشئ كلمة سر">
  </div>
</div>

<div class="btns">
<button class="btn-main" id="btnAction" onclick="handleAction()">تسجيل الدخول</button>
<button class="btn-sec" id="btnSwitch" onclick="toggleMode()">إنشاء حساب جديد</button>
<div class="link-text" id="linkText">ليس لدي حساب؟</div>
</div>

</div>
<script>
let currentMode = 'login';
function toggleMode(){
  if(currentMode==='login'){
    currentMode='register';
    document.getElementById('loginFields').style.display='none';
    document.getElementById('regFields').style.display='block';
    document.getElementById('btnAction').innerText='إنشاء الحساب';
    document.getElementById('btnSwitch').innerText='عندك حساب؟ سجل دخول';
    document.getElementById('mainTitle').innerText='إنشاء حساب جديد';
    document.getElementById('linkText').innerText='عندك حساب بالفعل؟';
  }else{
    currentMode='login';
    document.getElementById('loginFields').style.display='block';
    document.getElementById('regFields').style.display='none';
    document.getElementById('btnAction').innerText='تسجيل الدخول';
    document.getElementById('btnSwitch').innerText='إنشاء حساب جديد';
    document.getElementById('mainTitle').innerText='تسجيل الدخول';
    document.getElementById('linkText').innerText='ليس لدي حساب؟';
  }
  hideMsg();
}
function handleAction(){ if(currentMode==='login') doLogin(); else doRegister(); }
function hideMsg(){ document.getElementById('msgError').style.display='none'; document.getElementById('msgSuccess').style.display='none'; }
function doRegister(){
  let name=document.getElementById('regName').value.trim();
  let email=document.getElementById('regEmail').value.trim();
  let pass=document.getElementById('regPass').value.trim();
  let err=document.getElementById('msgError'); let suc=document.getElementById('msgSuccess');
  err.style.display='none'; suc.style.display='none';
  if(!name||!email||!pass){ err.style.display='block'; err.innerText='املأ كل الحقول'; return; }
  let users=JSON.parse(localStorage.getItem('farm_users')||'[]');
  if(users.find(u=>u.email===email)){ err.style.display='block'; err.innerText='البريد ده مسجل قبل كده'; return; }
  let newUser={id:Date.now(), name, email, password:pass};
  users.push(newUser); localStorage.setItem('farm_users',JSON.stringify(users));
  suc.style.display='block'; suc.innerText='تم إنشاء الحساب بنجاح';
  setTimeout(()=>{toggleMode()},1200);
}
function doLogin(){
  let email=document.getElementById('loginEmail').value.trim();
  let pass=document.getElementById('loginPass').value.trim();
  let err=document.getElementById('msgError'); err.style.display='none';
  if(!email||!pass){ err.style.display='block'; err.innerText='املأ البريد وكلمة السر'; return; }
  let users=JSON.parse(localStorage.getItem('farm_users')||'[]');
  let user=users.find(u=>u.email===email && u.password===pass);
  if(!user){ err.style.display='block'; err.innerText='البريد أو كلمة السر خطأ'; return; }
  localStorage.setItem('farm_currentUser',JSON.stringify(user));
  window.location.href='index.html';
}
</script>
</body>
</html>
